[package]
org = "ballerinax"
name = "oracledb"
version = "1.17.0"
authors = ["Ballerina"]
keywords = ["Client", "Network", "SQL", "RDBMS", "OracleDB", "Vendor/Oracle", "Area/Database", "Type/Connector"]
repository = "https://github.com/ballerina-platform/module-ballerinax-oracledb"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.13.1"

# Local testing: until cdc 1.4.0 (Debezium 3.5.1) is published to Ballerina Central, consume it
# from the local repository (`bal push --repository=local`). Remove once 1.4.0 is released.
[[dependency]]
org = "ballerinax"
name = "cdc"
version = "1.4.0"
repository = "local"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "oracledb-native"
version = "1.17.0"
path = "../native/build/libs/oracledb-native-1.17.0-SNAPSHOT.jar"

[[platform.java21.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "sql-native"
version = "1.19.0"
path = "./lib/sql-native-1.19.0.jar"
